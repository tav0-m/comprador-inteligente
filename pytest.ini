[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mostrar prints en caso de fallo
addopts = -v --tb=short

# Ignorar warnings de librerías externas
filterwarnings =
    ignore::DeprecationWarning:lightgbm.*
    ignore::DeprecationWarning:sklearn.*
    ignore::UserWarning:lightgbm.*
