services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: comprador_inteligente
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_user -d comprador_inteligente"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment: &app_environment
      APP_ENV: production
      DATABASE_URL: postgresql://ci_user:${POSTGRES_PASSWORD}@db:5432/comprador_inteligente
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Define ADMIN_API_KEY en .env}
      CORS_ORIGINS: '["http://localhost:3000"]'
      TRUSTED_HOSTS: '["localhost","127.0.0.1","api"]'
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      ENABLE_SERPAPI: ${ENABLE_SERPAPI:-false}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_PASSWORD: ${ALERT_EMAIL_PASSWORD:-}
      ALERT_EMAIL_SMTP: ${ALERT_EMAIL_SMTP:-smtp.gmail.com}
      ALERT_EMAIL_PORT: ${ALERT_EMAIL_PORT:-587}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info --concurrency=4 --queues=searches,maintenance,ml
    environment: *app_environment
    depends_on:
      api:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    command: celery -A app.worker beat --loglevel=info
    environment: *app_environment
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
